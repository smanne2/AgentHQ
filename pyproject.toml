[project]
name = "agent-hq-workspace"
version = "0.1.0"
description = "Agent HQ — centralized MCP server for agent guidance (workspace root)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "cli"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
