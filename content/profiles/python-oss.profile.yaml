id: python-oss
name: Python OSS Project
description: Python open source projects using pyproject.toml or requirements.txt.
matches:
  anyOf:
    - file: pyproject.toml
    - file: requirements.txt
stack:
  - python
defaults:
  workflow: standard-feature
  roles:
